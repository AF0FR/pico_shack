<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PicoCW Keyer</title><link rel="stylesheet" href="picofox.css"><style>
.header-menu{position:relative}.header-menu summary{list-style:none;cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:10px}.menu-items{position:absolute;right:0;z-index:5;min-width:210px;margin-top:7px;padding:6px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.menu-items a{display:block;padding:9px;color:var(--text);text-decoration:none}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h2{margin:0}.audio-toggle{width:auto;min-height:38px;padding:7px 11px;background:#293b53}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.fact{padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b1828;text-align:center}.fact small,.key-button small{display:block;color:var(--muted);font-size:11px}.keys{display:grid;grid-template-columns:1fr 1fr;gap:14px}.keys.straight{grid-template-columns:1fr}.key-button{min-height:112px;background:#a4520a;font-size:20px;touch-action:none;user-select:none}.key-button small{margin-top:5px;color:inherit}.key-button.active{background:var(--brand);color:#211000}@media(max-width:580px){.facts{grid-template-columns:1fr}.app-header{flex-direction:row;align-items:center}.header-menu{margin-left:auto}}
</style></head><body data-mode="<!--#mode-->" data-keymode="<!--#keymode-->" onload="if(Number(this.dataset.mode)!==1)document.getElementById('activate').click()">
<header class="app-header"><a class="brand" href="/index.shtml"><span class="brand-mark">CW</span><span class="brand-copy"><strong>PicoCW</strong><small>Manual MCW keyer</small></span></a><details class="header-menu"><summary>Menu ▾</summary><div class="menu-items"><a href="/index.shtml">Home</a><a href="/fox.shtml">PicoFox</a><a href="/cw-settings.shtml">PicoCW settings</a><a href="/settings.shtml">Device settings</a></div></details></header>
<section class="warning" id="inactive" hidden><strong>PicoCW is not active</strong><p>Switching features stops the current operation and makes the physical and browser keys available.</p><button class="primary" id="activate" type="button">Switch to PicoCW</button></section>
<section class="card" id="keyer"><div class="heading"><div><p class="note">LIVE KEYER</p><h2>PicoCW</h2></div><button class="audio-toggle" id="audio-toggle" type="button" aria-pressed="false">🔇 Sidetone</button></div><p class="active-readout">Keyer: <strong id="keyer-state">Ready</strong></p><div class="facts"><div class="fact"><small>Key mode</small><strong id="key-mode"></strong></div><div class="fact"><small>Speed</small><strong><!--#wpm--> WPM</strong></div><div class="fact"><small>Tone</small><strong><!--#cw--> Hz</strong></div></div><div class="keys" id="keys"><button class="key-button" data-key="dit" type="button"><span>DIT</span><small>← Left arrow</small></button><button class="key-button" data-key="dah" type="button"><span>DAH</span><small>Right arrow →</small></button></div></section><p class="note" id="message" role="status"></p>
<footer class="app-footer"><span><strong>PicoCW</strong> · Manual MCW keyer</span><span>Built by AF0FR</span></footer>
<script>const body=document.body,inactive=document.getElementById('inactive'),keyer=document.getElementById('keyer'),activate=document.getElementById('activate'),message=document.getElementById('message'),keys=document.getElementById('keys'),audioToggle=document.getElementById('audio-toggle'),keyerState=document.getElementById('keyer-state');let mode=Number(body.dataset.mode),queue=Promise.resolve(),held=new Set(),audioEnabled=false,audioContext=null,osc=null;const straight=body.dataset.keymode==='0';keys.classList.toggle('straight',straight);keys.querySelector('[data-key=dah]').hidden=straight;keys.querySelector('[data-key=dit] span').textContent=straight?'KEY':'DIT';document.getElementById('key-mode').textContent=straight?'Straight key':body.dataset.keymode==='2'?'Iambic B':'Iambic A';function render(){inactive.hidden=mode===1;keyer.hidden=mode!==1}activate.addEventListener('click',async()=>{activate.disabled=true;try{const r=await fetch('/mode.cgi?mode=1',{cache:'no-store'});if(!r.ok)throw Error();mode=1;render()}catch(e){activate.disabled=false;message.textContent='Feature switch failed.'}});function tone(down){if(!audioEnabled)return;if(down&&!osc){osc=audioContext.createOscillator();const g=audioContext.createGain();osc.type='square';osc.frequency.value=Number('<!--#cw-->')||500;g.gain.value=.045;osc.connect(g).connect(audioContext.destination);osc.start()}else if(!down&&osc){try{osc.stop()}catch(e){}osc=null}}function send(key,down,b){b.classList.toggle('active',down);tone(down);queue=queue.then(()=>fetch('/key.cgi?key='+key+'&down='+(down?1:0),{cache:'no-store'})).catch(()=>{message.textContent='Key request failed';b.classList.remove('active');tone(false)})}document.querySelectorAll('.key-button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send(b.dataset.key,true,b)});const up=e=>{e.preventDefault();send(b.dataset.key,false,b)};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>send(b.dataset.key,false,b))});function arrow(e){return e.key==='ArrowLeft'?'dit':e.key==='ArrowRight'?'dah':''}addEventListener('keydown',e=>{const k=arrow(e);if(!k||mode!==1||held.has(k)||e.altKey||e.ctrlKey||e.metaKey)return;e.preventDefault();held.add(k);send(k,true,keys.querySelector('[data-key='+k+']'))});function release(){held.forEach(k=>send(k,false,keys.querySelector('[data-key='+k+']')));held.clear()}addEventListener('keyup',e=>{const k=arrow(e);if(!held.has(k))return;e.preventDefault();held.delete(k);send(k,false,keys.querySelector('[data-key='+k+']'))});addEventListener('blur',release);addEventListener('pagehide',release);audioToggle.addEventListener('click',async()=>{audioEnabled=!audioEnabled;if(audioEnabled){audioContext??=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume()}else tone(false);audioToggle.textContent=audioEnabled?'🔊 Sidetone on':'🔇 Sidetone';audioToggle.setAttribute('aria-pressed',String(audioEnabled))});async function refresh(){try{const r=await fetch('/status.shtml?t='+Date.now(),{cache:'no-store'}),p=(await r.text()).trim().split('|');mode=Number(p[3]);keyerState.textContent=p[2].replace('PicoCW ','');render()}catch(e){}}render();setInterval(refresh,1000)</script></body></html>
